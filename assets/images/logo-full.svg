<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradientFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0B5"/>
      <stop offset="30%" stop-color="#DEBE88"/>
      <stop offset="60%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#916E3B"/>
    </linearGradient>
    <linearGradient id="goldGradientAccentFull" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2C48C"/>
      <stop offset="100%" stop-color="#A9875A"/>
    </linearGradient>
    <style>
      .brand-title {
        font-family: 'Cinzel', 'Playfair Display', serif;
        font-size: 38px;
        letter-spacing: 10px;
        fill: #FFFFFF;
        font-weight: 700;
        text-anchor: middle;
      }
      .tourist-home {
        font-family: 'Cinzel', 'Playfair Display', serif;
        font-size: 16px;
        letter-spacing: 7px;
        fill: url(#goldGradientFull);
        font-weight: 600;
        text-anchor: middle;
      }
      .tagline {
        font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
        font-size: 24px;
        font-style: italic;
        letter-spacing: 2px;
        fill: #D8D2C7;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Centered Crest Emblem -->
  <g transform="translate(400, 140) scale(0.68) translate(-250, -250)">
    <!-- Dual Ring System -->
    <circle cx="250" cy="250" r="172" fill="none" stroke="url(#goldGradientFull)" stroke-width="3" opacity="0.85"/>
    <circle cx="250" cy="250" r="162" fill="none" stroke="url(#goldGradientFull)" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.6"/>

    <!-- Top Crown -->
    <g transform="translate(250, 96)">
      <path d="M 0 -18 L 6 -6 L 14 -10 L 10 4 L -10 4 L -14 -10 L -6 -6 Z" fill="url(#goldGradientFull)"/>
      <circle cx="0" cy="-22" r="2.5" fill="url(#goldGradientAccentFull)"/>
      <circle cx="-15" cy="-13" r="2" fill="url(#goldGradientAccentFull)"/>
      <circle cx="15" cy="-13" r="2" fill="url(#goldGradientAccentFull)"/>
      <path d="M -12 6 H 12 V 8.5 H -12 Z" fill="url(#goldGradientFull)"/>
    </g>

    <!-- Star Sparkle -->
    <g transform="translate(372, 128)">
      <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="url(#goldGradientAccentFull)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Letter N -->
    <path d="M 148 165 H 182 V 174 H 168 V 326 H 182 V 335 H 148 V 326 H 162 V 174 H 148 Z" fill="url(#goldGradientFull)"/>
    <path d="M 164 168 L 296 328 H 312 V 174 H 298 V 165 H 332 V 174 H 318 V 326 H 332 V 335 H 290 L 164 182 Z" fill="url(#goldGradientFull)"/>
    <path d="M 298 165 H 332 V 174 H 318 V 326 H 332 V 335 H 298 V 326 H 312 V 174 H 298 Z" fill="url(#goldGradientFull)"/>

    <!-- Letter E -->
    <path d="M 242 165 H 262 V 335 H 242 Z" fill="url(#goldGradientAccentFull)" opacity="0.95"/>
    <path d="M 258 165 H 348 V 195 H 338 V 177 H 262 V 165 Z" fill="url(#goldGradientAccentFull)"/>
    <path d="M 258 244 H 325 V 256 H 258 Z" fill="url(#goldGradientAccentFull)"/>
    <polygon points="325,243 333,250 325,257 322,250" fill="url(#goldGradientAccentFull)"/>
    <path d="M 262 323 H 340 V 305 H 350 V 335 H 258 V 323 Z" fill="url(#goldGradientAccentFull)"/>

    <!-- Bottom Flourish -->
    <g transform="translate(250, 394)">
      <circle cx="0" cy="0" r="3" fill="url(#goldGradientAccentFull)"/>
      <path d="M -8 -2 Q -30 -14 -55 -2 Q -32 -6 -10 1 Z" fill="url(#goldGradientFull)"/>
      <path d="M 8 -2 Q 30 -14 55 -2 Q 32 -6 10 1 Z" fill="url(#goldGradientFull)"/>
    </g>
  </g>

  <!-- Typography: NANDHANAM ELITE -->
  <text x="406" y="325" class="brand-title">NANDHANAM ELITE</text>

  <!-- TOURIST HOME with decorative accent lines -->
  <line x1="230" y1="365" x2="300" y2="365" stroke="url(#goldGradientFull)" stroke-width="1.2"/>
  <text x="404" y="371" class="tourist-home">TOURIST HOME</text>
  <line x1="508" y1="365" x2="578" y2="365" stroke="url(#goldGradientFull)" stroke-width="1.2"/>

  <!-- Diamond Divider -->
  <line x1="335" y1="412" x2="385" y2="412" stroke="url(#goldGradientFull)" stroke-width="0.8"/>
  <polygon points="400,407 405,412 400,417 395,412" fill="url(#goldGradientAccentFull)"/>
  <line x1="415" y1="412" x2="465" y2="412" stroke="url(#goldGradientFull)" stroke-width="0.8"/>

  <!-- Tagline: your comfort, our hospitality -->
  <text x="400" y="460" class="tagline">your comfort, our hospitality</text>
</svg>
