<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradientEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0B5"/>
      <stop offset="30%" stop-color="#DEBE88"/>
      <stop offset="60%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#916E3B"/>
    </linearGradient>
    <linearGradient id="goldGradientAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2C48C"/>
      <stop offset="100%" stop-color="#A9875A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9C7A4A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Luxury Crest Circle with Dual Ring System -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="url(#goldGradientEmblem)" stroke-width="3" opacity="0.85"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#goldGradientEmblem)" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- Top Crown / Heritage Crest Motif -->
  <g id="crown-crest" transform="translate(250, 96)">
    <!-- Central Crown Fleur / Diamond -->
    <path d="M 0 -18 L 6 -6 L 14 -10 L 10 4 L -10 4 L -14 -10 L -6 -6 Z" fill="url(#goldGradientEmblem)"/>
    <circle cx="0" cy="-22" r="2.5" fill="url(#goldGradientAccent)"/>
    <circle cx="-15" cy="-13" r="2" fill="url(#goldGradientAccent)"/>
    <circle cx="15" cy="-13" r="2" fill="url(#goldGradientAccent)"/>
    <!-- Crown Base Band -->
    <path d="M -12 6 H 12 V 8.5 H -12 Z" fill="url(#goldGradientEmblem)"/>
  </g>

  <!-- Four-Point Star Sparkle at Upper Right (~1:30 position) -->
  <g transform="translate(372, 128)">
    <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="url(#goldGradientAccent)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Stylized Interlocking Monogram: N & E (Nandhanam Elite) -->
  <g id="monogram-ne" filter="url(#goldGlow)">
    <!-- ===== LETTER 'N' ===== -->
    <!-- Left Stem of N with Classical Serifs -->
    <path d="M 148 165 H 182 V 174 H 168 V 326 H 182 V 335 H 148 V 326 H 162 V 174 H 148 Z" fill="url(#goldGradientEmblem)"/>
    
    <!-- Diagonal Stroke of N -->
    <path d="M 164 168 L 296 328 H 312 V 174 H 298 V 165 H 332 V 174 H 318 V 326 H 332 V 335 H 290 L 164 182 Z" fill="url(#goldGradientEmblem)"/>
    
    <!-- Right Stem Serifs of N -->
    <path d="M 298 165 H 332 V 174 H 318 V 326 H 332 V 335 H 298 V 326 H 312 V 174 H 298 Z" fill="url(#goldGradientEmblem)"/>

    <!-- ===== LETTER 'E' Interlocking with N ===== -->
    <!-- Central / Right Spine & Arms of E in Complementary Gold -->
    <!-- E Vertical Spine -->
    <path d="M 242 165 H 262 V 335 H 242 Z" fill="url(#goldGradientAccent)" opacity="0.95"/>
    
    <!-- E Top Arm with Classical Serif -->
    <path d="M 258 165 H 348 V 195 H 338 V 177 H 262 V 165 Z" fill="url(#goldGradientAccent)"/>
    
    <!-- E Middle Arm with Center Diamond Accent -->
    <path d="M 258 244 H 325 V 256 H 258 Z" fill="url(#goldGradientAccent)"/>
    <polygon points="325,243 333,250 325,257 322,250" fill="url(#goldGradientAccent)"/>
    
    <!-- E Bottom Arm with Classical Serif -->
    <path d="M 262 323 H 340 V 305 H 350 V 335 H 258 V 323 Z" fill="url(#goldGradientAccent)"/>
  </g>

  <!-- Bottom Botanical Laurel / Flourish (Symbol of Nandhanam - Celestial Garden) -->
  <g id="bottom-flourish" transform="translate(250, 394)">
    <circle cx="0" cy="0" r="3" fill="url(#goldGradientAccent)"/>
    <path d="M -8 -2 Q -30 -14 -55 -2 Q -32 -6 -10 1 Z" fill="url(#goldGradientEmblem)"/>
    <path d="M 8 -2 Q 30 -14 55 -2 Q 32 -6 10 1 Z" fill="url(#goldGradientEmblem)"/>
    <circle cx="-55" cy="-2" r="1.8" fill="url(#goldGradientAccent)"/>
    <circle cx="55" cy="-2" r="1.8" fill="url(#goldGradientAccent)"/>
  </g>
</svg>
